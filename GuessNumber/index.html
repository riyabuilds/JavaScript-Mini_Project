<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess a number</title>
  </head>
  <body style="background-color: rgb(155, 227, 199)">
    <h1>Number guessing game</h1>
    <h2>
      Try and guess a random number between 1 and 100 <br />
      <br />
      You have 10 attempts to guess the right number
    </h2>
    <br />
    <br />
    <h1>Guess a number</h1>
    <input type="number" min="1" max="100" id="number" /> <br /><br />
    <h2><button id="submit">Submit guess</button><br /><br /></h2>
    <div id="results"></div>
    <br />
    <h2>
      <div id="turn">You have 10 turn left</div>
      <br />
      <div id="previous"></div>
      <br />
      <div id="guess"></div>
      <br />
      <div id="random"></div>
      <br />
    </h2>
    <script src="script.js"></script>
  </body>
</html>
